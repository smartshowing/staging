<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.5}
    header,footer{opacity:.8}
    nav a{margin-right:12px}
    code,pre{background:#f5f5f5;padding:2px 6px;border-radius:6px}
    pre{padding:12px;overflow:auto}
    .card{border:1px solid #e6e6e6;border-radius:12px;padding:16px;margin:16px 0}
  </style>
</head>
<body>
  <header>
    <h1 style="margin-bottom:6px">{{ .Site.Title }}</h1>
    <nav>
  <a href="/">Overview</a>
  <a href="/how-it-works/">How It Works</a>
  <a href="/modes/">Modes</a>
  <a href="/zones/">Zones</a>
  <a href="/devices/">Devices</a>
  <a href="/whats-required/">What’s Required</a>
  <a href="/privacy/">Privacy</a>
  <a href="/getting-started/">Getting Started</a>
</nav>
    <hr />
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <hr />
    <small>Smart Showing — internal brochure draft</small>
  </footer>
</body>
</html>
